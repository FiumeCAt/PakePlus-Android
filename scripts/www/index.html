<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NovelAI 净图工具</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header>
    <div class="app-brand">
      <img src="icon.png" alt="logo" class="brand-logo">
      <div>
        <h1>NovelAI 批量净图 Pro</h1>
        <p>本地离线运行 · 抹除 EXIF 与 Alpha/RGB 像素隐写</p>
      </div>
    </div>
  </header>

  <div class="settings-card">
    <div class="setting-row">
      <span>输出图片格式</span>
      <select id="formatSelect">
        <option value="image/png">PNG (无损画质，抹除隐写)</option>
        <option value="image/jpeg">JPG (体积小，95%高画质)</option>
        <option value="image/webp">WebP (高压缩比)</option>
      </select>
    </div>
    <div class="setting-row">
      <span>文件名脱敏 (防文件名泄密)</span>
      <select id="nameSelect">
        <option value="seq">序号重命名 (clean_001, 002...)</option>
        <option value="keep">保留原文件名</option>
      </select>
    </div>
  </div>

  <div class="import-box">
    <div class="import-btns">
      <label class="btn btn-primary">
        ➕ 批量选择图片 (可多选)
        <input type="file" id="fileInput" accept="image/*" multiple>
      </label>
      <label class="btn btn-outline">
        📂 导入文件夹
        <input type="file" id="folderInput" webkitdirectory directory multiple>
      </label>
    </div>
    <p class="sub-hint">支持多次追加导入 · 彻底销毁 NovelAI 参数与隐写</p>
  </div>

  <div class="progress-box" id="progressBox">
    <div class="progress-text">
      <span id="progressStatus">正在处理...</span>
      <span id="progressCount">0 / 0</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="batch-panel" id="batchPanel">
    <div class="batch-stats">
      <span id="statsText">已清理 0 张图片</span>
      <button class="btn btn-danger btn-sm" id="clearBtn">🗑️ 清空列表</button>
    </div>
    <div class="batch-grid">
      <button class="btn btn-primary btn-full" id="batchSaveBtn">📲 一键批量存入相册 / 系统分享</button>
      <button class="btn btn-success" id="zipShareBtn">📦 导出/分享 ZIP 包</button>
      <button class="btn btn-outline" id="seqDownloadBtn">⬇️ 逐张下载图片</button>
    </div>
  </div>

  <div class="results-grid" id="resultsGrid"></div>
</div>

<div id="toast" class="toast"></div>

<script src="js/zip.js"></script>
<script src="js/app.js"></script>
</body>
</html>
